name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.9.11 (the release must still be a draft)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install HelSpin and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build the installer
        run: python packaging/build_installer.py
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/installer/HelSpin-*-setup.exe --clobber
