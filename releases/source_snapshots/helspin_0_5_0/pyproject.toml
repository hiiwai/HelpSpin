[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helspin"
version = "0.5.0"
description = "Compare Bruker NMR spectra and build publication figures"
requires-python = ">=3.11"
license = { file = "LICENSE" }   # free for academic use; commercial needs a licence

dependencies = [
    "numpy>=1.26,<2.5",  # nmrglue 0.11's tecmag.py uses a numpy dtype alias
                         # ('a8') that numpy fully removed at 2.5 -- a hard
                         # import-time crash, not a deprecation warning, and
                         # unrelated to any Bruker-reading code we call. See
                         # README "Bugs the tests caught" and re-check this
                         # ceiling when nmrglue publishes a fix.
    "scipy>=1.11",       # pulled in by nmrglue; used for 2D interpolation
    "nmrglue>=0.10",     # New BSD
    "python-pptx>=0.6",  # PowerPoint export (MIT). Optional at runtime: the
                         # export path reports a clear error if it is absent,
                         # so the app still runs without it.
    "matplotlib>=3.8",
    "pillow>=10.0",      # required for TIFF and JPEG export; declared explicitly
    "PySide6>=6.6",      # LGPLv3 -- package one-dir so Qt stays relinkable
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.scripts]
# Console entry point. Keeps a terminal attached, which is what --version and
# --check need in order to print anything at all.
helspin = "helspin.__main__:main"

[project.gui-scripts]
# Windows-only distinction: a gui-script is linked against pythonw, so
# double-clicking it opens the window WITHOUT a console box behind it. On
# macOS and Linux the two are equivalent.
helspin-gui = "helspin.__main__:main"

[tool.setuptools.package-data]
# The icon has to travel with the wheel; without this the installed copy has
# no resources directory and the app falls back to a blank window icon.
helspin = ["resources/*.png", "resources/*.txt"]

[tool.setuptools.packages.find]
include = ["helspin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["helspin"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["helspin/domain", "helspin/services"]

[[tool.mypy.overrides]]
module = ["nmrglue.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
